[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-extractor"
dynamic = ["version"]
description = "Extract structured sections from Markdown by header — bracket-style access with robust handling of code blocks, tables, math, and YAML front matter."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Fasil", email = "fasilwdr@hotmail.com" },
]
keywords = ["markdown", "parser", "extractor", "headers", "sections", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "lxml>=4.9", "build", "twine"]
xpath = ["lxml>=4.9"]

[project.urls]
Homepage = "https://github.com/fasilwdr/MD-Extractor"
Documentation = "https://github.com/fasilwdr/MD-Extractor#readme"
Source = "https://github.com/fasilwdr/MD-Extractor"
Issues = "https://github.com/fasilwdr/MD-Extractor/issues"
Changelog = "https://github.com/fasilwdr/MD-Extractor/releases"

[tool.setuptools.dynamic]
version = { attr = "markdown_extractor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
markdown_extractor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
